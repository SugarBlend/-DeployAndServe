weights_path: null
config_path: null
formats:
  - onnx
  - tensorrt
enable_mixed_precision: true
input_nodes:
  latent:
    shape: [2, 1280]
    precision: float16
  timestep:
    shape: [1,]
    precision: int64
  prompt_embeds:
    shape: [2, 1280]
    precision: float16
  encoder_hidden_states:
    shape: [2, 77, 1280]
    precision: float16
  attention_mask:
    shape: [2, 77]
    precision: bool
output_nodes:
  image_embeds:
    shape: [2, 1280]
    precision: float16
device: cuda:0
repeats: 1000
enable_benchmark: false
enable_visualization: false

executor:
  module: deploy2serve.deployment.projects.kandinsky_2.prior_transformer.executor
  class_name: PriorTransformerExecutor
exporter:
  module: deploy2serve.deployment.projects.kandinsky_2.prior_transformer.export
  class_name: PriorTransformerExporter

calibration:
  calibration_frames: 1000
  excluded_frames: [ ]
  labels_generator:
    module: deploy2serve.deployment.core.exporters.calibration.generators.prompts
    class_name: PromptGenerator
  storage:
    module: deploy2serve.deployment.core.exporters.calibration.dataset.zarr_dataset
    class_name: ZarrChunkedDataset
  cache_path: checkpoints/

tensorrt:
  specific:
    log_level: INFO
    precision: int8
    workspace: 134_217_728
    profile_shapes:
      latent:
        - min: [ 2, 1280 ]
          opt: [ 4, 1280 ]
          max: [ 8, 1280 ]
      timestep:
        - min: [1,]
          opt: [1,]
          max: [1,]
      prompt_embeds:
        - min: [ 2, 1280 ]
          opt: [ 4, 1280]
          max: [ 8, 1280]
      encoder_hidden_states:
        - min: [ 2, 77, 1280 ]
          opt: [ 4, 77, 1280 ]
          max: [ 8, 77, 1280]
      attention_mask:
        - min: [ 2, 77 ]
          opt: [ 4, 77 ]
          max: [ 8, 77 ]
    flags:
      - TF32
      - DIRECT_IO
      - OBEY_PRECISION_CONSTRAINTS
      - SPARSE_WEIGHTS
    builder_optimization_level: 5
    profiling_verbosity: NONE
    max_aux_streams: 4
    runtime_platform: null
    compatibility_level: null
    algorithm: ENTROPY_CALIBRATION_2
  enable_timing_cache: true
  enable_calibration_cache: true
  output_file: checkpoints/kandinsky_2/prior_transformer/tensorrt/model.plan
  force_rebuild: true

onnx:
  specific:
    keep_initializers_as_inputs: false
    export_params: true
    verbose: null
    input_names: [latent, timestep, prompt_embeds, encoder_hidden_states, attention_mask]
    output_names: [image_embeds]
    opset_version: 20
    dynamic_axes:
      latent:
        0: batch
      prompt_embeds:
        0: batch
      encoder_hidden_states:
        0: batch
      attention_mask:
        0: batch
      image_embeds:
        0: batch
    training: EVAL
    do_constant_folding: true
  modelopt:
    quant_mode: int8
    calib_method: entropy
    calibration_eps:
      - cuda
      - cpu
      - dml
    op_types_to_quantize:
      - Gemm
      - MatMul
    qdq_for_weights: false
    use_external_data_format: false
    keep_intermediate_files: true
  simplify: false
  output_file: checkpoints/kandinsky_2/prior_transformer/onnx/model.onnx
  force_rebuild: true

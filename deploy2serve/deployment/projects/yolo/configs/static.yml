weights_path: weights/pytorch/yolo12m.pt
config_path: null

formats:
  - openvino
  - torchscript
  - onnx
  - tensorrt
enable_mixed_precision: true
input_nodes:
  images:
    shape: [1, 3, 384, 640]
    precision: float16
output_nodes:
  output:
    shape: [1, 84, 5040]
    precision: float16
device: cuda:0
repeats: 1000
enable_benchmark: true
enable_visualization: true

exporter:
  module_path: deploy2serve.deployment.projects.yolo.export
  class_name: YoloExporter
executor:
  module_path: deploy2serve.deployment.projects.yolo.executor
  class_name: YoloExecutor

tensorrt:
  specific:
    log_level: ERROR
    precision: int8
    profile_shapes:
      images:
        - min: [1, 3, 384, 640]
          opt: [1, 3, 384, 640]
          max: [1, 3, 384, 640]
    workspace: 268_435_456
    flags:
      - TF32
      - DIRECT_IO
#      - PREFER_PRECISION_CONSTRAINTS
      - SPARSE_WEIGHTS
    profiling_verbosity: NONE
    max_aux_streams: 4
    runtime_platform: null
    compatibility_level: null
    tactics: null
    algorithm: ENTROPY_CALIBRATION_2
  dataset:
    description:
      name: coco
      images: "http://images.cocodataset.org/zips/val2017.zip"
      annotations: "http://images.cocodataset.org/annotations/annotations_trainval2017.zip"
    calibration_frames: null
    exclude_frames: []
    labels_generator:
      module_path: deploy2serve.deployment.core.exporters.calibration.generators.coco
      class_name: CocoGenerator
    data_storage:
      module_path: deploy2serve.deployment.core.exporters.calibration.dataset.zarr_dataset
      class_name: ZarrChunkedDataset
#      module_path: deploy2serve.deployment.core.exporters.calibration.dataset.hdf5
#      class_name: HDF5ChunkedDataset
  enable_timing_cache: true
  enable_calibration_cache: true
  output_file: weights/yolo/tensorrt/model.plan
  force_rebuild: true

onnx:
  specific:
    keep_initializers_as_inputs: false
    export_params: true
    verbose: null
    input_names: [images]
    output_names: [output]
    opset_version: 11
    dynamic_axes: null
    training: EVAL
    do_constant_folding: true
  modelopt:
    quant_mode: int8
    calib_method: max
    calib_buffer: 500
    calibration_eps:
      - cuda
      - cpu
      - dml
    op_types_to_quantize:
      - MatMul
      - Conv
    nodes_to_exclude:
      - /Shape
    qdq_for_weights: false
    use_external_data_format: false
    keep_intermediate_files: false
  simplify: true
  output_file: weights/yolo/onnx/model.onnx
  force_rebuild: true


torchscript:
  optimize: false
  output_file: weights/yolo/torchscript/model.pt
  force_rebuild: true

openvino:
  precision: fp16
  output_file: weights/yolo/openvino/model.xml
  force_rebuild: true
  input_names:
    - images
  device: CPU

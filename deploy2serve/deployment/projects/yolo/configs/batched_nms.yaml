weights_path: checkpoints/pytorch/yolo12m.pt
config_path: null

formats:
  - onnx
  - tensorrt
enable_mixed_precision: true
input_nodes:
  images:
    shape: [1, 3, 384, 640]
    precision: float16
output_nodes:
  bboxes:
    shape: [1, 5040, 1, 4]
    precision: float16
  scores:
    shape: [1, 5040, 80]
    precision: float16
device: cuda:0
repeats: 1000
enable_benchmark: false
enable_visualization: true

exporter:
  module: deploy2serve.deployment.projects.yolo.export
  class_name: YoloExporter
executor:
  module: deploy2serve.deployment.projects.yolo.executor
  class_name: YoloExecutor

tensorrt:
  plugins:
    - name: batched_nms
      options:
        max_det: 75
        score_threshold: 0.25
        iou_threshold: 0.4
  specific:
    log_level: INFO
    precision: fp16
    profile_shapes:
      images:
        - min: [1, 3, 384, 640]
          opt: [4, 3, 384, 640]
          max: [8, 3, 384, 640]
    workspace: 268_435_456
    flags:
      - TF32
      - DIRECT_IO
      - PREFER_PRECISION_CONSTRAINTS
      - SPARSE_WEIGHTS
    builder_optimization_level: 5
    tiling_optimization_level: FULL
    profiling_verbosity: NONE
    runtime_platform: null
    compatibility_level: null
    algorithm: ENTROPY_CALIBRATION_2
  enable_timing_cache: true
  enable_calibration_cache: true
  output_file: checkpoints/yolo/tensorrt/model.plan
  force_rebuild: true

onnx:
  specific:
    keep_initializers_as_inputs: false
    export_params: true
    verbose: null
    input_names: [images]
    output_names: [bboxes, scores]
    opset_version: 11
    dynamic_axes:
      images:
        0: batch
      bboxes:
        0: batch
      scores:
        0: batch
    training: EVAL
    do_constant_folding: true
  simplify: true
  output_file: checkpoints/yolo/onnx/model.onnx
  force_rebuild: true

torchscript:
  optimize: false
  output_file: checkpoints/yolo/torchscript/model.pt
  force_rebuild: true

openvino:
  precision: fp16
  output_file: checkpoints/yolo/openvino/model.xml
  force_rebuild: true
  input_names:
    - images
  device: CPU
